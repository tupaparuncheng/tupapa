<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等摩擦法風管計算器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
            background-color: #f4f4f4;
        }
        .wrapper {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }
        .container, .results-panel {
            flex: 1;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #e9e9e9;
        }
        /* 新增紅色文字樣式 */
        .red-text {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <h2>等摩擦法風管計算</h2>

            <div class="input-group">
                <label for="pressureDrop">設定壓損 (Pa/m):</label>
                <input type="number" id="pressureDrop" value="1.0" step="0.1" readonly>
            </div>

      
            <div class="input-group">
                <label for="airflow">風量 (CMH):</label>
                <input type="number" id="airflow" value="61200">
            </div>

            <button onclick="calculateRecommendedDiameter()">計算推薦圓管管徑</button>

            <h3>自訂管徑計算 (風速與壓損)</h3>
            <p>根據設定風量與自訂管徑，計算風速及實際壓損。</p>
      
            <div class="input-group">
                <label for="customDiameter">自訂圓管管徑 (mm):</label>
                <input type="number" id="customDiameter" placeholder="輸入直徑">
            </div>

            <div class="input-group">
                <label for="customWidth">自訂矩形長邊 (mm):</label>
             
                <input type="number" id="customWidth" placeholder="輸入寬度">
            </div>

            <div class="input-group">
                <label for="customHeight">自訂矩形短邊 (mm):</label>
                <input type="number" id="customHeight" placeholder="輸入高度">
            </div>

            <button onclick="calculateCustomDuct()">計算自訂管徑風速與壓損</button>

       
            <div class="result" id="customResult">
                <strong>計算風速 (m/s):</strong> <span id="calculatedVelocity"></span><br>
                <strong>長寬比:</strong> <span id="calculatedRatio"></span>
            </div>
            
            <h3>自訂風速計算風量</h3>
            <p>根據自訂風速與管徑尺寸，計算風量。</p>
       
            <div class="input-group">
                <label for="customVelocity">自訂風速 (m/s):</label>
                <input type="number" id="customVelocity" value="3.0" step="0.1">
            </div>
            <div class="input-group">
                <label for="velocityDuctDiameter">圓管管徑 (mm):</label>
             
                <input type="number" id="velocityDuctDiameter" placeholder="或輸入圓管直徑">
            </div>
            <div class="input-group">
                <label for="velocityDuctWidth">矩形長邊 (mm):</label>
                <input type="number" id="velocityDuctWidth" placeholder="或輸入矩形寬度">
            </div>
            <div class="input-group">
       
                <label for="velocityDuctHeight">矩形短邊 (mm):</label>
                <input type="number" id="velocityDuctHeight" placeholder="或輸入矩形高度">
            </div>
            <button onclick="calculateAirflowFromVelocity()">計算風量</button>
            <div class="result" id="velocityResult">
                <strong>計算風量 (m³/h CMH):</strong> <span id="calculatedAirflowCMH"></span>
           
            </div>
        </div>

        <div class="results-panel">
            <h2>推薦管徑詳細結果</h2>
            <div class="result" id="recommendationDetails">
                <p>請先在左側輸入風量並點擊「計算推薦圓管管徑」。</p>
            </div>

            <h3>標準圓管風速換算表 (V=Q/A)</h3>
            <div id="velocityTableContainer">
  
                <p>請先在左側輸入風量並點擊「計算推薦圓管管徑」以產生表格。</p>
            </div>
        </div>
    </div>

    <script>
        const airDensity = 1.204;
        const airViscosity = 1.8e-5;
        const roughness = 0.09;
        const FIXED_PRESSURE_DROP = 1.0;
        // 使用圖片中的所有數值
        const standardDiameters = [
            75, 100, 125, 150, 175, 200, 225, 250, 275, 300, 
            325, 350, 375, 400, 425, 450, 475, 500, 550, 600, 
            650, 700, 750, 800, 850, 900, 950, 1000, 1100, 1200, 
            1300, 1400, 1500, 1600, 1700, 1800
        ];

        function cmhToM3s(cmh) { return cmh / 3600;
        }
        function m3sToCmh(m3s) { return m3s * 3600;
        }
        function calculateReynolds(V, D) { return (V * D * airDensity) / airViscosity;
        }
        
        function calculateFrictionFactor(D, Re) {
            const roughnessM = roughness / 1000;
            const val1 = roughnessM / (3.7 * D);
            const val2 = 5.74 / Math.pow(Re, 0.9);
            const frictionFactor = 0.25 / Math.pow(Math.log10(val1 + val2), 2);
            return frictionFactor;
        }

        function calculatePressureDropPerMeter(D, V) {
            const Re = calculateReynolds(V, D);
            const f = calculateFrictionFactor(D, Re);
            const pressureDrop = f * airDensity * Math.pow(V, 2) / (2 * D);
            return pressureDrop;
        }

        function calculateDiameter(Q, F_PaPerM) {
            let D = 0.3;
            for (let i = 0; i < 10; i++) {
                let V = Q / (Math.PI * Math.pow(D, 2) / 4);
                let currentF = calculatePressureDropPerMeter(D, V);
                D = D * Math.pow(currentF / F_PaPerM, 0.2);
            }
            return D;
        }

        function calculateEquivalentDiameter(W, H) {
            return 1.3 * Math.pow((W * H), 0.625) / Math.pow((W + H), 0.25);
        }

        function generateVelocityTable(airflowCMH) {
            const airflowM3s = cmhToM3s(airflowCMH);
            let tableHTML = '<table><thead><tr><th>圓管直徑 (mm)</th><th>風速 (m/s)</th></tr></thead><tbody>';

            standardDiameters.forEach(Dmm => {
                const Dm = Dmm / 1000;
                const area = Math.PI * Math.pow(Dm, 2) / 4;
                const velocity = airflowM3s / area;
                tableHTML += `<tr><td>${Dmm}</td><td>${velocity.toFixed(2)}</td></tr>`;
        
            });

            tableHTML += '</tbody></table>';
            document.getElementById('velocityTableContainer').innerHTML = tableHTML;
        }

        function calculateRecommendedDiameter() {
            const pressureDrop = FIXED_PRESSURE_DROP;
            const airflowCMH = parseFloat(document.getElementById('airflow').value);

            if (isNaN(airflowCMH) || airflowCMH <= 0) {
                alert("請輸入有效的風量數值。");
                return;
            }

            const airflowM3s = cmhToM3s(airflowCMH);
            const recommendedD = calculateDiameter(airflowM3s, pressureDrop);
            const recommendedDmm = (recommendedD * 1000).toFixed(0);
            
            // 新增 MM 轉英吋並無條件進位計算
            const mmToInch = 25.4;
            // 無條件進位使用 Math.ceil()
            const recommendedDInch = Math.ceil(recommendedDmm / mmToInch);
            
            const area = Math.PI * Math.pow(recommendedD, 2) / 4;
            const velocity = airflowM3s / area;
            
            // 面積計算 (m^2 轉 cm^2 並取整數) [cite: 48]
            const areaCM2 = (area * 10000).toFixed(0); 

            document.getElementById('recommendationDetails').innerHTML = `
                <strong>推薦圓管直徑:</strong> ${recommendedDmm} mm (${recommendedDInch}")<br>
                <strong>對應風速:</strong> ${velocity.toFixed(2)} m/s<br>
                <strong>對應面積:</strong> ${areaCM2} cm²<br>
                <strong>輸入風量:</strong> ${airflowCMH.toFixed(0)} m³/h (CMH)
            `;
            generateVelocityTable(airflowCMH);
        }

        function calculateCustomDuct() {
            const airflowCMH = parseFloat(document.getElementById('airflow').value);
            const customDiameterMM = parseFloat(document.getElementById('customDiameter').value);
            const customWidthMM = parseFloat(document.getElementById('customWidth').value);
            const customHeightMM = parseFloat(document.getElementById('customHeight').value);
            
            if (isNaN(airflowCMH) || airflowCMH <= 0) {
                alert("請輸入有效的風量。");
                return;
            }

            const airflowM3s = cmhToM3s(airflowCMH);
            let diameterM = 0;
            let ratioText = '';
            let isCircular = false;

            if (!isNaN(customDiameterMM) && customDiameterMM > 0) {
                // 圓管計算
                diameterM = customDiameterMM / 1000;
                isCircular = true;
                ratioText = '圓管';
            } else if (!isNaN(customWidthMM) && !isNaN(customHeightMM) && customWidthMM > 0 && customHeightMM > 0) {
                // 矩形管計算
                const widthM = customWidthMM / 1000;
                const heightM = customHeightMM / 1000;
                
                // 計算等效直徑用於風速/壓損計算 [cite: 55, 56]
                diameterM = calculateEquivalentDiameter(widthM, heightM);
                
                // 計算長寬比 (長邊除以短邊)
                const ratio = Math.max(customWidthMM, customHeightMM) / Math.min(customWidthMM, customHeightMM);
                ratioText = ratio.toFixed(2);
                
                // 判斷是否超過 1:3
                if (ratio > 3) {
                    ratioText = `<span class="red-text">${ratioText} (> 3.00)</span>`;
                } else {
                    ratioText = `${ratioText}`;
                }

            } else {
                alert("請輸入有效的圓管直徑或矩形長寬。");
                return;
            }

            // 通用計算 (風管面積用於計算風速)
            const area = isCircular ? (Math.PI * Math.pow(diameterM, 2) / 4) : ((customWidthMM / 1000) * (customHeightMM / 1000));
            const velocity = airflowM3s / area;
            // 實際壓損計算 (雖然不顯示，但保留計算邏輯確保程式完整) [cite: 58, 59]
            const calculatedF = calculatePressureDropPerMeter(diameterM, velocity);

            // 更新結果顯示 (只顯示風速和長寬比)
            document.getElementById('calculatedVelocity').textContent = velocity.toFixed(2) + " m/s";
            document.getElementById('calculatedRatio').innerHTML = ratioText;
            
            // 清除舊的壓損結果，確保其不顯示
            const oldPressureDropSpan = document.getElementById('calculatedPressureDrop');
            if(oldPressureDropSpan) {
                oldPressureDropSpan.textContent = '';
            }
        }

        function calculateAirflowFromVelocity() {
            const customVelocity = parseFloat(document.getElementById('customVelocity').value);
            const ductDiameterMM = parseFloat(document.getElementById('velocityDuctDiameter').value);
            const ductWidthMM = parseFloat(document.getElementById('velocityDuctWidth').value);
            const ductHeightMM = parseFloat(document.getElementById('velocityDuctHeight').value);
            if (isNaN(customVelocity) || customVelocity <= 0) {
                alert("請輸入有效的風速。");
                return;
            }

            let areaM2 = 0;
            if (!isNaN(ductDiameterMM) && ductDiameterMM > 0) {
                const diameterM = ductDiameterMM / 1000;
                areaM2 = Math.PI * Math.pow(diameterM, 2) / 4;
            } else if (!isNaN(ductWidthMM) && !isNaN(ductHeightMM) && ductWidthMM > 0 && ductHeightMM > 0) {
                const widthM = ductWidthMM / 1000;
                const heightM = ductHeightMM / 1000;
                areaM2 = widthM * heightM;
            } else {
                alert("請輸入有效的管徑尺寸（圓管直徑或矩形長寬）。");
                return;
            }

            const airflowM3s = customVelocity * areaM2;
            const airflowCMH = m3sToCmh(airflowM3s);

            document.getElementById('calculatedAirflowCMH').textContent = airflowCMH.toFixed(0) + " m³/h";
        }
    </script>
</body>
</html>
