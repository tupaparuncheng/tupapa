<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等摩擦法風管計算器 v4.1</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; background-color: #f4f4f4; }
        .wrapper { display: flex; gap: 20px; max-width: 1200px; margin: auto; }
        .container, .results-panel { flex: 1; padding: 20px; background-color: #fff; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        .result { margin-top: 20px; padding: 15px; background-color: #f9f9f9; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #e9e9e9; }
        .red-text { color: red; font-weight: bold; }
        hr { border: 0; border-top: 1px solid #ddd; margin: 15px 0; }
        .ratio-title { color: #555; font-size: 0.9em; margin-top: 10px; margin-bottom: 5px; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <h2>等摩擦法風管計算</h2>
            <div class="input-group">
                <label>設定壓損 (Pa/m):</label>
                <input type="number" id="pressureDrop" value="1.0" readonly>
            </div>
            <div class="input-group">
                <label>風量 (CMH):</label>
                <input type="number" id="airflow" value="61200">
            </div>
            <button onclick="calculateRecommendedDiameter()">計算推薦圓管管徑</button>

            <h3>自訂管徑計算 (風速與比例)</h3>
            <div class="input-group"><label>自訂圓管管徑 (mm):</label><input type="number" id="customDiameter"></div>
            <div class="input-group"><label>自訂矩形長邊 (mm):</label><input type="number" id="customWidth"></div>
            <div class="input-group"><label>自訂矩形短邊 (mm):</label><input type="number" id="customHeight"></div>
            <button onclick="calculateCustomDuct()">計算自訂數據</button>
            <div class="result">
                <strong>計算風速 (m/s):</strong> <span id="calculatedVelocity"></span><br>
                <strong>長寬比:</strong> <span id="calculatedRatio"></span>
            </div>
        </div>

        <div class="results-panel">
            <h2>推薦管徑詳細結果</h2>
            <div id="recommendationDetails" class="result">
                <p>請輸入風量並點擊計算。</p>
            </div>
            <h3>標準圓管風速換算表</h3>
            <div id="velocityTableContainer"></div>
        </div>
    </div>

    <script>
        const airDensity = 1.204, airViscosity = 1.8e-5, roughness = 0.09;
        const FIXED_PRESSURE_DROP = 1.0;
        const standardDiameters = [75, 100, 125, 150, 175, 200, 225, 250, 275, 300, 350, 400, 450, 500, 600, 700, 800, 900, 1000, 1200, 1400, 1600, 1800];

        function cmhToM3s(cmh) { return cmh / 3600; }
        
        function calculatePressureDropPerMeter(D, V) {
            const Re = (V * D * airDensity) / airViscosity;
            const rM = roughness / 1000;
            const f = 0.25 / Math.pow(Math.log10(rM / (3.7 * D) + 5.74 / Math.pow(Re, 0.9)), 2);
            return f * airDensity * Math.pow(V, 2) / (2 * D);
        }

        function calculateDiameter(Q, F_PaPerM) {
            let D = 0.5;
            for (let i = 0; i < 15; i++) {
                let V = Q / (Math.PI * Math.pow(D, 2) / 4);
                D = D * Math.pow(calculatePressureDropPerMeter(D, V) / F_PaPerM, 0.2);
            }
            return D;
        }

        function getRectSides(De_mm, ratio) {
            const K = 1.30 * (Math.pow(ratio, 0.625) / Math.pow(ratio + 1, 0.25));
            const shortSide = De_mm / K;
            const longSide = shortSide * ratio;
            return { a: Math.round(longSide), b: Math.round(shortSide) };
        }

        function calculateRecommendedDiameter() {
            const airflowCMH = parseFloat(document.getElementById('airflow').value);
            if (!airflowCMH) return;
            const airflowM3s = cmhToM3s(airflowCMH);
            const recommendedD = calculateDiameter(airflowM3s, FIXED_PRESSURE_DROP);
            const Dmm = (recommendedD * 1000).toFixed(0);
            const DInch = Math.ceil(Dmm / 25.4);
            
            const areaCirc = Math.PI * Math.pow(recommendedD, 2) / 4;
            const velCirc = airflowM3s / areaCirc;

            let html = `
                <strong>推薦圓管直徑:</strong> ${Dmm} mm (${DInch}")<br>
                <strong>對應圓管面積:</strong> ${(areaCirc * 10000).toFixed(0)} cm²<br>
                <strong>對應圓管風速:</strong> ${velCirc.toFixed(2)} m/s<br>
                <hr>`;

            [1, 2, 3, 4].forEach(r => {
                const sides = getRectSides(Dmm, r);
                const areaM2 = (sides.a / 1000) * (sides.b / 1000);
                const vel = airflowM3s / areaM2;
                html += `
                    <div class="ratio-title">等效矩形管 (比例 1:${r})</div>
                    <strong>尺寸:</strong> ${sides.a} x ${sides.b} mm<br>
                    <strong>對應面積:</strong> ${(areaM2 * 10000).toFixed(0)} cm²<br>
                    <strong>對應風速:</strong> ${vel.toFixed(2)} m/s<br>
                `;
                if(r < 4) html += `<hr style="border-top: 1px dotted #eee; margin: 8px 0;">`;
            });

            html += `<hr><strong>輸入風量:</strong> ${airflowCMH} m³/h (CMH)`;
            document.getElementById('recommendationDetails').innerHTML = html;
            generateVelocityTable(airflowCMH);
        }

        function generateVelocityTable(airflowCMH) {
            const Q = cmhToM3s(airflowCMH);
            let h = '<table><tr><th>直徑(mm)</th><th>風速(m/s)</th></tr>';
            standardDiameters.forEach(d => {
                const v = Q / (Math.PI * Math.pow(d/1000, 2) / 4);
                h += `<tr><td>${d}</td><td>${v.toFixed(2)}</td></tr>`;
            });
            document.getElementById('velocityTableContainer').innerHTML = h + '</table>';
        }

        function calculateCustomDuct() {
            const Q = cmhToM3s(parseFloat(document.getElementById('airflow').value));
            const d = parseFloat(document.getElementById('customDiameter').value);
            const w = parseFloat(document.getElementById('customWidth').value);
            const h = parseFloat(document.getElementById('customHeight').value);
            let area = 0, ratioText = "圓管";

            if (d > 0) {
                area = Math.PI * Math.pow(d/1000, 2) / 4;
            } else if (w > 0 && h > 0) {
                area = (w/1000) * (h/1000);
                const ratio = Math.max(w, h) / Math.min(w, h);
                ratioText = ratio.toFixed(2);
                
                // 修改門檻：超過 4 才會顯示紅色
                if (ratio > 4) {
                    ratioText = `<span class="red-text">${ratioText} (> 4.00)</span>`;
                }
            }
            
            document.getElementById('calculatedVelocity').textContent = area > 0 ? (Q / area).toFixed(2) + " m/s" : "---";
            document.getElementById('calculatedRatio').innerHTML = ratioText;
        }
    </script>
</body>
</html>
